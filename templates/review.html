<!DOCTYPE html>
<html>
<head>

<title>Rate Your Learning Partner</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body{
    background:#f5f7fa;
}

.rating{
    display:flex;
    flex-direction:row-reverse;
    justify-content:center;
}

.rating input{
    display:none;
}

.rating label{
    font-size:40px;
    color:#ccc;
    cursor:pointer;
    transition:0.3s;
}

.rating input:checked ~ label,
.rating label:hover,
.rating label:hover ~ label{
    color:#ffc107;
}

.review-card{
    max-width:700px;
    margin:auto;
    margin-top:50px;
    border-radius:20px;
}

</style>

</head>

<body>

<div class="container">

<div class="card shadow review-card">

<div class="card-body p-5">

<h2 class="text-center mb-4">

⭐ Rate Your Learning Partner

</h2>

<form method="POST">

<div class="rating mb-4">

<input type="radio"
id="star5"
name="rating"
value="5">

<label for="star5">★</label>

<input type="radio"
id="star4"
name="rating"
value="4">

<label for="star4">★</label>

<input type="radio"
id="star3"
name="rating"
value="3">

<label for="star3">★</label>

<input type="radio"
id="star2"
name="rating"
value="2">

<label for="star2">★</label>

<input type="radio"
id="star1"
name="rating"
value="1">

<label for="star1">★</label>

</div>

<textarea
name="comment"
class="form-control mb-4"
rows="5"
placeholder="Share your learning experience..."></textarea>

<button
class="btn btn-success w-100">

Submit Review

</button>

</form>

</div>

</div>

</div>

</body>
</html>
