<!DOCTYPE html>
<html>
<head>

<title>Book Session</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h2>Book Session</h2>

<form method="POST">

<label>Date</label>

<input
type="date"
name="session_date"
class="form-control mb-3"
required>

<label>Time</label>

<input
type="time"
name="session_time"
class="form-control mb-3"
required>

<label>Mode</label>

<select
name="mode"
class="form-control mb-3">

<option>Online</option>
<option>Offline</option>

</select>

<button
class="btn btn-success">

Book Session

</button>

</form>

</div>

</body>
</html>
