<!DOCTYPE html>
<html>
<head>

<title>Requests</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h2>Learning Requests</h2>

{% for req in requests %}

<div class="card p-3 mb-3">

<p>

Request ID:
{{ req.id }}

</p>

<p>

Status:
{{ req.status }}

</p>

<a
href="/send_request/{{ match.user.id }}"
class="btn btn-primary me-2">

Send Request

</a>

<a
href="/book_session/{{ match.user.id }}"
class="btn btn-success">

Book Session

</a>

<br><br>

<a
href="/reject/{{ req.id }}"
class="btn btn-danger">

Reject

</a>

</div>

{% endfor %}

</div>

</body>
</html>
